<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>КубСтрайк - Мультиплеер</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        /* Увеличенные стили для кнопок, чтобы удобно нажимать на телефоне */
        .menu-btn {
            padding: 16px 24px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            width: 100%;
            margin: 8px 0;
            border: none;
            background: #3742fa;
            color: #fff;
            box-sizing: border-box;
            text-align: center;
        }
        .menu-btn.secondary {
            background: #57606f;
        }
    </style>
</head>
<body>
    <canvas id="game-canvas"></canvas>

    <div id="ui-container">
        <!-- Главное меню -->
        <div id="main-menu" class="menu-screen">
            <h1>КубСтрайк</h1>
            <button id="btn-multiplayer" class="menu-btn" onclick="openMenu('rooms-menu')">Мультиплеер</button>
            <button id="btn-settings" class="menu-btn secondary" onclick="openMenu('settings-menu')">Настройки</button>
        </div>

        <!-- Меню мультиплеера с кнопкой Обновить -->
        <div id="rooms-menu" class="menu-screen" style="display: none;">
            <h2>Серверы</h2>
            
            <div style="width: 100%; background: rgba(255,255,255,0.05); padding: 12px; border-radius: 10px; margin-bottom: 10px; text-align: left; box-sizing: border-box;">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
                    <span style="color: #fff; font-weight: bold; font-size: 15px;">Доступные серверы:</span>
                    <button onclick="loadServersList()" style="background: #3742fa; color: #fff; border: none; padding: 10px 16px; border-radius: 8px; font-size: 13px; font-weight: bold; cursor: pointer;">🔄 Обновить</button>
                </div>
                <div id="servers-list" style="color: #aaa; font-size: 14px; max-height: 150px; overflow-y: auto;">
                    <div>Загрузка серверов...</div>
                </div>
            </div>

            <button id="btn-create-room" class="menu-btn" onclick="openMenu('create-room-modal')">Создать свой сервер</button>
            <button id="btn-friends" class="menu-btn secondary" onclick="openMenu('friends-menu')">Друзья (<span id="friends-counter">0</span>)</button>
            <button id="btn-back-main" class="menu-btn secondary" onclick="openMenu('main-menu')">Назад</button>
        </div>

        <!-- Меню друзей -->
        <div id="friends-menu" class="menu-screen" style="display: none;">
            <h2>Друзья</h2>
            <p style="color: #aaa; font-size: 13px; margin: 0 0 10px 0; text-align: center;">Нажмите на друга, чтобы зайти к нему на сервер:</p>
            <div style="width: 100%; background: rgba(255,255,255,0.05); padding: 12px; border-radius: 10px; margin-bottom: 10px; text-align: left; box-sizing: border-box;">
                <div id="friends-list" style="color: #aaa; font-size: 14px; max-height: 150px; overflow-y: auto;">
                    <div>Пока нет друзей</div>
                </div>
            </div>
            <button id="btn-add-friend" class="menu-btn" onclick="openMenu('add-friend-modal')">Добавить друга</button>
            <button id="btn-back-rooms" class="menu-btn secondary" onclick="openMenu('rooms-menu')">Назад</button>
        </div>

        <!-- Меню создания сервера -->
        <div id="create-room-modal" class="menu-screen" style="display: none;">
            <h2>Создать сервер</h2>
            <input type="text" id="new-server-name" placeholder="Название сервера" style="padding: 14px; font-size: 16px; border-radius: 8px; border: none; width: 100%; margin-bottom: 10px; box-sizing: border-box;">
            <input type="password" id="new-server-password" placeholder="Пароль (пусто, если без пароля)" style="padding: 14px; font-size: 16px; border-radius: 8px; border: none; width: 100%; margin-bottom: 10px; box-sizing: border-box;">
            <span id="create-error-msg" style="color: #ff4757; font-size: 14px; min-height: 20px;"></span>
            <button class="menu-btn" onclick="createServer()">Создать и войти</button>
            <button class="menu-btn secondary" onclick="openMenu('rooms-menu')">Отмена</button>
        </div>

        <!-- Окно пароля -->
        <div id="password-modal" class="menu-screen" style="display: none;">
            <h2>Введите пароль</h2>
            <p id="target-server-title" style="color: #aaa; font-size: 14px; margin: 0 0 10px 0; text-align: center;"></p>
            <input type="password" id="join-server-password" placeholder="Пароль сервера" style="padding: 14px; font-size: 16px; border-radius: 8px; border: none; width: 100%; margin-bottom: 10px; box-sizing: border-box;">
            <span id="password-error-msg" style="color: #ff4757; font-size: 14px; min-height: 20px;"></span>
            <button class="menu-btn" onclick="verifyAndJoinServer()">Войти</button>
            <button class="menu-btn secondary" onclick="openMenu('rooms-menu')">Отмена</button>
        </div>

        <!-- Настройки -->
        <div id="settings-menu" class="menu-screen" style="display: none;">
            <h2>Настройки</h2>
            <div style="width: 100%; background: #1e272e; padding: 16px; border-radius: 10px; text-align: center; box-sizing: border-box;">
                <p style="color: #aaa; margin: 0 0 6px 0; font-size: 15px;">Ваш игровой ID:</p>
                <span id="player-id-display" style="color: #2ed573; font-size: 20px; font-weight: bold;">Загрузка...</span>
            </div>
            <button id="btn-back-settings" class="menu-btn secondary" onclick="openMenu('main-menu')">Назад</button>
        </div>

        <!-- Добавление друга -->
        <div id="add-friend-modal" class="menu-screen" style="display: none;">
            <h2>Добавление друга</h2>
            <input type="text" id="friend-id-input" placeholder="Введите ID игрока" style="padding: 14px; font-size: 16px; border-radius: 8px; border: none; width: 100%; margin-bottom: 10px; box-sizing: border-box;">
            <span id="friend-error-msg" style="color: #ff4757; font-size: 14px; min-height: 20px;"></span>
            <button class="menu-btn" onclick="sendFriendId()">Отправить</button>
            <button class="menu-btn secondary" onclick="openMenu('friends-menu')">Отмена</button>
        </div>
    </div>

    <!-- Игровой HUD -->
    <div id="game-hud" style="display: none;">
        <div id="health-container" style="background: rgba(0,0,0,0.6); padding: 8px 12px; border-radius: 8px; border: 1px solid #ff4757;">
            <span id="health-text" style="color: #ff4757; font-weight: bold; font-size: 16px;">HP: 100</span>
        </div>
        <div id="joystick-zone">
            <div id="joystick-stick"></div>
        </div>
        <button id="fire-btn">ОГОНЬ</button>
        <button id="jump-btn">ПРЫЖОК</button>
    </div>

    <script>
        const firebaseConfig = {
            databaseURL: "https://cubestrike-256d2-default-rtdb.firebaseio.com"
        };
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.database();

        let myId = localStorage.getItem('cube_strike_id');
        if (!myId) {
            myId = '' + Math.floor(10000 + Math.random() * 90000);
            localStorage.setItem('cube_strike_id', myId);
        }
        const myName = "Игрок " + myId;

        const userRef = db.ref('users/' + myId);
        userRef.set({ id: myId, name: myName, online: true, currentServer: null });
        userRef.onDisconnect().update({ online: false, currentServer: null });

        let selectedServerId = null;
        let selectedServerData = null;

        function openMenu(menuId) {
            document.querySelectorAll('.menu-screen').forEach(screen => {
                screen.style.display = 'none';
            });
            document.getElementById(menuId).style.display = 'flex';

            if (menuId === 'settings-menu') {
                document.getElementById('player-id-display').textContent = myId;
            }
            if (menuId === 'rooms-menu') {
                loadServersList();
                loadFriendsList();
            }
            if (menuId === 'friends-menu') {
                loadFriendsList();
            }
            if (menuId === 'add-friend-modal') {
                document.getElementById('friend-id-input').value = '';
                document.getElementById('friend-error-msg').textContent = '';
            }
        }

        // Загрузка серверов с крупной и удобной кнопкой "Войти"
        function loadServersList() {
            const listDiv = document.getElementById('servers-list');
            listDiv.innerHTML = '<div style="color: #aaa; text-align: center; padding: 12px;">Обновление...</div>';

            db.ref('servers').once('value', (snapshot) => {
                listDiv.innerHTML = '';
                if (snapshot.exists()) {
                    snapshot.forEach((child) => {
                        const srvId = child.key;
                        const srv = child.val();
                        const hasPassword = srv.password && srv.password.length > 0;

                        const div = document.createElement('div');
                        div.style.cssText = 'background: rgba(255,255,255,0.08); padding: 14px; border-radius: 10px; margin-bottom: 10px;';
                        div.innerHTML = `
                            <div style="margin-bottom: 8px;">
                                <span style="color: #fff; font-weight: bold; font-size: 16px;">${srv.name}</span>
                                <div style="color: #aaa; font-size: 13px; margin-top: 2px;">Хост: ${srv.hostName} ${hasPassword ? '🔒' : '🔓'}</div>
                            </div>
                        `;

                        const joinBtn = document.createElement('button');
                        joinBtn.className = 'menu-btn';
                        joinBtn.style.cssText = 'width: 100%; padding: 12px 20px; font-size: 15px; margin: 0; background: #2ed573; cursor: pointer; border-radius: 8px; border: none; color: #fff; font-weight: bold;';
                        joinBtn.textContent = 'Войти на сервер';
                        
                        joinBtn.onclick = () => {
                            tryJoinServer(srvId);
                        };

                        div.appendChild(joinBtn);
                        listDiv.appendChild(div);
                    });
                } else {
                    listDiv.innerHTML = '<div style="color: #aaa; text-align: center; padding: 15px;">Нет активных серверов</div>';
                }
            });
        }

        function createServer() {
            const nameInput = document.getElementById('new-server-name');
            const passInput = document.getElementById('new-server-password');
            const err = document.getElementById('create-error-msg');
            
            const name = nameInput.value.trim();
            const password = passInput.value.trim();

            if (!name) {
                err.textContent = 'Введите название!';
                return;
            }

            const serverRef = db.ref('servers').push();
            serverRef.set({
                name: name,
                password: password,
                hostId: myId,
                hostName: myName
            }).then(() => {
                selectedServerId = serverRef.key;
                selectedServerData = { name: name, password: password };
                enterGameRoom(serverRef.key, name);
            });
        }

        function tryJoinServer(serverId) {
            db.ref('servers/' + serverId).once('value', (snapshot) => {
                if (!snapshot.exists()) {
                    alert('Сервер не найден!');
                    return;
                }
                const srv = snapshot.val();
                selectedServerId = serverId;
                selectedServerData = srv;

                if (srv.password && typeof srv.password === 'string' && srv.password.trim() !== '') {
                    document.querySelectorAll('.menu-screen').forEach(screen => {
                        screen.style.display = 'none';
                    });
                    document.getElementById('password-modal').style.display = 'flex';
                    document.getElementById('target-server-title').textContent = 'Сервер: ' + srv.name;
                    document.getElementById('join-server-password').value = '';
                    document.getElementById('password-error-msg').textContent = '';
                } else {
                    enterGameRoom(serverId, srv.name);
                }
            });
        }

        function verifyAndJoinServer() {
            const passInput = document.getElementById('join-server-password');
            const err = document.getElementById('password-error-msg');

            if (passInput.value === selectedServerData.password) {
                enterGameRoom(selectedServerId, selectedServerData.name);
            } else {
                err.textContent = 'Неверный пароль!';
            }
        }

        function enterGameRoom(serverId, serverName) {
            db.ref('users/' + myId).update({ currentServer: serverId });

            document.getElementById('ui-container').style.display = 'none';
            document.getElementById('game-hud').style.display = 'block';

            if (typeof init3DGame === 'function') {
                init3DGame(serverId, serverName, myId, myName);
            } else {
                alert('Ошибка: 3D скрипт игры не загружен!');
            }
        }

        function sendFriendId() {
            const input = document.getElementById('friend-id-input');
            const err = document.getElementById('friend-error-msg');
            const targetId = input.value.trim();

            if (!targetId) {
                err.textContent = 'Введите ID!';
                return;
            }

            if (targetId === myId) {
                err.textContent = 'Нельзя добавить себя!';
                return;
            }

            err.textContent = 'Поиск игрока...';

            db.ref('users/' + targetId).once('value').then((snapshot) => {
                if (snapshot.exists()) {
                    const friendData = snapshot.val();
                    db.ref('friends/' + myId + '/' + targetId).set({
                        id: friendData.id || targetId,
                        name: friendData.name || "Друг " + targetId
                    }).then(() => {
                        openMenu('friends-menu');
                    });
                } else {
                    err.textContent = 'Игрок с таким ID не найден!';
                }
            }).catch(() => {
                err.textContent = 'Ошибка сети.';
            });
        }

        function loadFriendsList() {
            const listDiv = document.getElementById('friends-list');
            const counterEl = document.getElementById('friends-counter');

            db.ref('friends/' + myId).once('value', (snapshot) => {
                listDiv.innerHTML = '';
                let count = 0;
                if (snapshot.exists()) {
                    snapshot.forEach((child) => {
                        count++;
                        const f = child.val();
                        
                        db.ref('users/' + f.id).once('value', (userSnap) => {
                            let srvId = null;
                            if (userSnap.exists()) {
                                const uData = userSnap.val();
                                srvId = uData.currentServer;
                            }

                            const div = document.createElement('div');
                            div.style.cssText = 'background: rgba(255,255,255,0.08); padding: 12px; border-radius: 10px; margin-bottom: 8px;';
                            div.innerHTML = `
                                <div style="margin-bottom: 8px;">
                                    <div style="color: #fff; font-weight: bold; font-size: 15px;">👤 ${f.name}</div>
                                    <div style="color: #2ed573; font-size: 12px; margin-top: 2px;">ID: ${f.id}</div>
                                </div>
                            `;

                            const friendBtn = document.createElement('button');
                            friendBtn.className = 'menu-btn';
                            friendBtn.style.cssText = 'width: 100%; padding: 10px 16px; font-size: 14px; margin: 0; background: #ffa502; cursor: pointer; border-radius: 8px; border: none; color: #fff; font-weight: bold;';
                            friendBtn.textContent = srvId ? 'К другу на сервер' : 'Не в игре';

                            friendBtn.onclick = () => {
                                if (srvId) {
                                    tryJoinServer(srvId);
                                } else {
                                    alert('Этот друг сейчас не на сервере!');
                                }
                            };

                            div.appendChild(friendBtn);
                            listDiv.appendChild(div);
                        });
                    });
                } else {
                    listDiv.innerHTML = '<div style="color: #aaa; text-align: center; padding: 10px;">Пока нет друзей</div>';
                }
                if (counterEl) counterEl.textContent = count;
            });
        }
    </script>
<script src="js/game3d.js"></script>
<script src="js/ui.js"></script>
</body>
</html>
